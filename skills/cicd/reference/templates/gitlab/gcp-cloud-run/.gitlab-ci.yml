# GitLab -> GCP Cloud Run — worked example. quality (merge gate) -> deploy -> docs.
# Per-env target lives in config/<branch>.env (versioned, NON-SECRET).
# App secrets live in Secret Manager, injected at deploy via --set-secrets (never in git).
# Pipeline auth: Workload Identity Federation (keyless — no stored SA key).
# Copy this file AND wiki-sync.gitlab-ci.yml to the repo root; replace every <PLACEHOLDER>.
# See reference/cloud/gcp.md and reference/ci/gitlab.md.

stages:
  - quality
  - deploy
  - docs

include:
  - local: wiki-sync.gitlab-ci.yml

# --- Merge gate: must pass before an MR can merge (enable "Pipelines must succeed") ---
quality:
  stage: quality
  image: python:3.12-slim
  script:
    - pip install --quiet uv
    - uv sync --all-extras
    - uv run pre-commit run --all-files
    - uv run pytest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# --- Deploy: only after a merge to a protected environment branch ---
deploy:
  stage: deploy
  image: google/cloud-sdk:slim
  environment:
    name: $CI_COMMIT_BRANCH
  # Keyless auth: GitLab OIDC token -> GCP Workload Identity Federation.
  id_tokens:
    GCP_ID_TOKEN:
      aud: //iam.googleapis.com/projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/<POOL>/providers/<PROVIDER>
  script:
    # 1. Per-env target (non-secret, versioned)
    - set -a; . "config/${CI_COMMIT_BRANCH}.env"; set +a
    # 2. Authenticate to GCP via Workload Identity Federation
    - echo "$GCP_ID_TOKEN" > token.txt
    - |
      gcloud iam workload-identity-pools create-cred-config \
        projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/<POOL>/providers/<PROVIDER> \
        --service-account="<SA>@${GCP_PROJECT}.iam.gserviceaccount.com" \
        --credential-source-file=token.txt --output-file=cred.json
    - gcloud auth login --cred-file=cred.json
    - gcloud config set project "$GCP_PROJECT"
    # 3. Build & push the image (Cloud Build), then deploy to Cloud Run
    - IMAGE="${REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}/${CLOUD_RUN_SERVICE}:${CI_COMMIT_SHORT_SHA}"
    - gcloud builds submit --tag "$IMAGE"
    - |
      gcloud run deploy "$CLOUD_RUN_SERVICE" \
        --image "$IMAGE" --region "$REGION" \
        --set-secrets "API_KEY=api-key:latest,DB_PASSWORD=db-password:latest" \
        --set-env-vars "ENV=${CI_COMMIT_BRANCH}"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|uat|main|master)$/
      when: on_success
    - when: never
